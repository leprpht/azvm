name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: darwin-arm64
            goos: darwin
            goarch: arm64

          - name: darwin-amd64
            goos: darwin
            goarch: amd64

          - name: linux-amd64
            goos: linux
            goarch: amd64

          - name: linux-arm64
            goos: linux
            goarch: arm64

          - name: windows-amd64
            goos: windows
            goarch: amd64
            extension: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -o dist/azvm-${GITHUB_REF_NAME}-${{ matrix.name }}${{ matrix.extension }} \
            ./cmd/azvm

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: azvm-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: azvm-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: azvm ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*