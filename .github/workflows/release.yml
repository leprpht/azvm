name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Build release binaries
        run: |
          mkdir -p dist

          GOOS=darwin GOARCH=arm64 go build -o dist/azvm-${GITHUB_REF_NAME}-darwin-arm64 ./cmd/azvm
          GOOS=darwin GOARCH=amd64 go build -o dist/azvm-${GITHUB_REF_NAME}-darwin-amd64 ./cmd/azvm
          GOOS=linux GOARCH=amd64 go build -o dist/azvm-${GITHUB_REF_NAME}-linux-amd64 ./cmd/azvm
          GOOS=linux GOARCH=arm64 go build -o dist/azvm-${GITHUB_REF_NAME}-linux-arm64 ./cmd/azvm
          GOOS=windows GOARCH=amd64 go build -o dist/azvm-${GITHUB_REF_NAME}-windows-amd64.exe ./cmd/azvm

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: azvm ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*